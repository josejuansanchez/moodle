# =============================================================================
#  VirtualHost de Moodle
#  Destino: /etc/apache2/sites-available/moodle.conf
#
#  Plantilla: los scripts sustituyen las variables DOMAIN y MOODLE_DIR con
#  envsubst. APACHE_LOG_DIR no se toca: es una variable propia de Apache.
#
#  Certbot (script 02) copia este sitio para crear la versión HTTPS
#  (moodle-le-ssl.conf) y añade aquí la redirección HTTP -> HTTPS.
# =============================================================================
<VirtualHost *:80>
    ServerName ${DOMAIN}

    # Desde Moodle 5.1 solo la subcarpeta "public" es accesible desde la web
    DocumentRoot ${MOODLE_DIR}/public

    <Directory ${MOODLE_DIR}/public>
        # No mostrar listados de directorios
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        # Router de Moodle (>= 5.1): las URL que no son ficheros van a r.php
        FallbackResource /r.php
    </Directory>

    # Necesario para las URL de ficheros de Moodle (pluginfile.php/...)
    AcceptPathInfo On

    # Bloquear ficheros internos que nunca deben servirse (recomendación de Moodle)
    RewriteEngine On
    RewriteRule "(^|/)\.(?!well-known/)"                             - [F]
    RewriteRule "(composer\.json|\.lock|environment\.xml)"           - [F]
    RewriteRule "(/install\.xml|/upgrade\.txt|/README|/readme)"      - [F]
    RewriteRule "(/vendor/|/node_modules/|/tests/behat/|/fixtures/)" - [F]

    ErrorLog  ${APACHE_LOG_DIR}/moodle-error.log
    CustomLog ${APACHE_LOG_DIR}/moodle-access.log combined
</VirtualHost>
