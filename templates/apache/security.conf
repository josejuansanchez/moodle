# =============================================================================
#  Endurecimiento básico de Apache
#  Destino: /etc/apache2/conf-available/security.conf
# =============================================================================

# No mostrar la versión de Apache ni del sistema en cabeceras y páginas de error
ServerTokens Prod
ServerSignature Off

# Desactivar el método HTTP TRACE (puede usarse en ataques XST)
TraceEnable Off
