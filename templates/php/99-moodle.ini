; =============================================================================
;  Ajustes de PHP recomendados para Moodle
;  Destino: /etc/php/<versión>/fpm/conf.d/ y /etc/php/<versión>/cli/conf.d/
;
;  Se usa un fichero propio en conf.d en lugar de editar php.ini: así los
;  cambios quedan separados y no se pierden al actualizar PHP.
; =============================================================================

memory_limit        = 256M
upload_max_filesize = 100M
post_max_size       = 100M
max_execution_time  = 300

; Moodle exige al menos 5000 (formularios con muchos campos)
max_input_vars      = 5000

; OPcache guarda el código PHP ya compilado en memoria: mucho más rápido
opcache.enable                = 1
opcache.memory_consumption    = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq       = 60
